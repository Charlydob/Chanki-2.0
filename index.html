<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Cardshell">
    <meta name="theme-color" content="#f4f7ff" />
    <title>Cardshell</title>
    <link rel="manifest" href="./public/manifest.webmanifest" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/auth.css" />
    <link rel="stylesheet" href="./styles/decks.css" />
    <link rel="stylesheet" href="./styles/cards.css" />
    <link rel="stylesheet" href="./styles/study.css" />
    <link rel="stylesheet" href="./styles/explore.css" />
    <link rel="stylesheet" href="./styles/stats.css" />
    <link rel="stylesheet" href="./styles/settings.css" />
    <link rel="stylesheet" href="./styles/debug.css" />
  </head>
  <body>
    <div class="boot-fallback" id="boot-fallback">
      <h1>Cardshell</h1>
      <p>Preparando tu espacio de estudio de alemán...</p>
    </div>

    <div class="app-shell is-hidden" id="app-shell">
      <header class="top-bar">
        <h1 id="view-title">Cardshell</h1>
        <button class="btn-ghost btn-debug-toggle" id="debug-toggle" aria-label="Abrir debug">•</button>
      </header>

      <main id="app-view" class="app-view"></main>

      <nav class="bottom-nav" id="bottom-nav">
        <button data-route="decks">Mazos</button>
        <button data-route="cards">Tarjetas</button>
        <button data-route="study">Estudiar</button>
        <button data-route="explore">Explorar</button>
        <button data-route="stats">Stats</button>
        <button data-route="settings">Ajustes</button>
      </nav>
    </div>

    <section id="debug-panel" class="debug-panel is-hidden"></section>

    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
